name: hills_book_store
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  flutter_animate: ^4.5.0
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  intl: ^0.19.0
  url_launcher: ^6.3.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3

  # Auth Providers
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # State Management
  provider: ^6.1.2

  # Clean Architecture Helpers
  equatable: ^2.0.5
  get_it: ^7.7.0
  dartz: ^0.10.1

  # Helpers
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/covers/
    - assets/images/onboarding/
    - assets/fonts/
    - assets/icons/
    - assets/images/covers/cover1.png
    - assets/images/covers/cover2.png
    - assets/images/covers/cover3.png
    - assets/images/covers/cover4.png
    - assets/images/covers/cover5.png
    - assets/images/covers/cover6.png
    - assets/images/covers/cover7.png
    - assets/images/covers/cover8.png
    - assets/images/covers/cover9.png
    - assets/images/covers/cover10.png
    - assets/images/covers/hills.jpg